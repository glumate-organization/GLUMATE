name: Deploy to GitHub Pages

on:
  push:
    branches: [main] # 기본 브랜치가 main이 아니면 여기 수정
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          # 없어도 빌드는 통과한다 (푸터 '국세청 확인' 배지만 미표시)
          NTS_API_KEY: ${{ secrets.NTS_API_KEY }}
          # 배포 위치. 지금은 저장소 하위 경로(github.io/GLUMATE/)로 나간다.
          # glumate.org DNS 를 GitHub Pages 로 옮긴 뒤에는 아래 두 줄을 지우면
          # 기본값(https://glumate.org, base '/')으로 돌아간다. public/CNAME 도 그때 추가.
          SITE_URL: https://glumate-organization.github.io
          BASE_PATH: /GLUMATE
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
